<title>Peak Shave Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  /* Layout: a narrow rail of inputs on the left, a wide results column on the right, a readout strip above both. */
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#E4E9EE; --ink:#0F1B26; --ink-2:#47586A; --ink-3:#74879A;
  --line:#D2DAE2; --line-2:#B9C5D1;
  --accent:#0B5DA8; --accent-ink:#FFFFFF; --accent-soft:#D9E9F7;
  --good:#12754A; --good-soft:#D6EFE1; --bad:#B23A24; --bad-soft:#F6DCD5; --amber:#B06A06; --amber-soft:#F6E5C3;
  --font-head:'Barlow Condensed','Arial Narrow','Helvetica Neue',sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C131A; --surface:#131D27; --surface-2:#1A2733; --ink:#E7EDF3; --ink-2:#9FB1C1; --ink-3:#6F8394;
  --line:#25364A; --line-2:#364B61; --accent:#5DAAF2; --accent-ink:#06131F; --accent-soft:#16293D;
  --good:#4CC38A; --good-soft:#12301F; --bad:#F28870; --bad-soft:#3A1E17; --amber:#E4A43C; --amber-soft:#3A2B10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C131A; --surface:#131D27; --surface-2:#1A2733; --ink:#E7EDF3; --ink-2:#9FB1C1; --ink-3:#6F8394;
  --line:#25364A; --line-2:#364B61; --accent:#5DAAF2; --accent-ink:#06131F; --accent-soft:#16293D;
  --good:#4CC38A; --good-soft:#12301F; --bad:#F28870; --bad-soft:#3A1E17; --amber:#E4A43C; --amber-soft:#3A2B10; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin-inline:auto;padding-inline:16px}
.num,.mono{font-variant-numeric:tabular-nums}

/* masthead */
.mast{padding-block:18px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.mast h1{font-size:30px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.mast p{color:var(--ink-2);max-width:60ch}

/* readout strip */
.readout{background:var(--surface);border:1px solid var(--line);border-radius:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin-bottom:18px}
.ro-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.ro{padding:10px 14px;min-width:0;border-left:1px solid var(--line)}
.ro:first-child{border-left:0}
.ro .k{font:600 11px/1.2 var(--font-head);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.ro .v{font:600 26px/1.15 var(--font-head);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro .s{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ro.good .v{color:var(--good)} .ro.bad .v{color:var(--bad)}
.readout.busy .ro .v{opacity:.35}
.busybar{height:2px;background:transparent;overflow:hidden}
.readout.busy .busybar{background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:slide 1s linear infinite}
@keyframes slide{from{background-position:-40% 0}to{background-position:140% 0}}
@media (prefers-reduced-motion:reduce){.readout.busy .busybar{animation:none;background:var(--accent);opacity:.4}}

/* stacked flow: inputs, recommendation, then two collapsed drawers */
.rail{min-width:0}
.out{min-width:0;display:flex;flex-direction:column;gap:0}
.start{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:22px;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.card .lead{font-size:14px;color:var(--ink-2);max-width:56ch}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
.or{font-size:13px;color:var(--ink-3)}
.row.alt{align-items:center}
h2.sh{font-size:22px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}
#verdict{margin-bottom:6px}
.dd{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-top:14px}
.dd>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;padding:14px 16px;font:600 19px var(--font-head);letter-spacing:.06em;text-transform:uppercase}
.dd>summary::-webkit-details-marker{display:none}
.dd>summary small{font:400 13px var(--font-body);letter-spacing:0;text-transform:none;color:var(--ink-3);flex:1;min-width:0}
.dd>summary::after{content:'+';font:500 22px var(--font-mono);color:var(--ink-3);margin-left:auto}
.dd[open]>summary::after{content:'\2212'}
.dd[open]>summary{border-bottom:1px solid var(--line)}
.ddbody{padding:8px 16px 18px}
.dd .out .blk{border:0;border-radius:0;background:transparent;padding:18px 0;border-top:1px solid var(--line)}
.dd .out .blk:first-child{border-top:0}
.dd .rail .sec:first-child{border-top:0}

/* tooltips */
.fl{display:flex;align-items:center;gap:6px}
.tip{flex:none;width:16px;height:16px;padding:0;border:1px solid var(--line-2);border-radius:50%;background:var(--surface);color:var(--ink-3);font:italic 700 10.5px/1 var(--font-body);cursor:help;display:inline-grid;place-items:center;vertical-align:middle;margin-left:5px}
.fl .tip{margin-left:0}
.tip:hover,.tip:focus-visible{border-color:var(--accent);color:var(--accent)}
.ro .k{display:flex;align-items:center;gap:4px}
.ro .k .tip{margin-left:2px}
th .tip{margin-left:4px}
#tipbox{position:fixed;z-index:50;max-width:min(280px,calc(100vw - 16px));background:var(--ink);color:var(--bg);font:400 13px/1.4 var(--font-body);padding:8px 10px;border-radius:5px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#tipbox[hidden]{display:none}

/* rail sections */
.sec{border-top:2px solid var(--ink);padding-block:4px 6px;margin-bottom:6px}
.sec>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;padding-block:8px;font:600 17px var(--font-head);letter-spacing:.1em;text-transform:uppercase}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary small{font:500 12px var(--font-body);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.sec>summary::after{content:'+';font:500 20px var(--font-mono);color:var(--ink-3);margin-left:8px}
.sec[open]>summary::after{content:'\2212'}
.sec .body{display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.fl{font-size:13px;color:var(--ink-2)}
.fi{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);min-width:0}
.fi:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fi input,.fi select{border:0;background:transparent;padding:7px 8px;min-width:0;width:100%;font-family:var(--font-mono);font-size:14px;outline:0}
.fi em{font:normal 12px var(--font-body);color:var(--ink-3);padding-right:8px;white-space:nowrap}
.fi b{font:500 13px var(--font-mono);color:var(--ink-3);padding-left:8px}
.f small{font-size:12px;color:var(--ink-3)}
select.plain{width:100%;padding:8px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);font-size:14px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.chk input{margin-top:4px;accent-color:var(--accent)}
.chk small{display:block;color:var(--ink-3);font-size:12px}
.sum{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2);border-top:1px dotted var(--line-2);padding-top:6px}
.sum b{font-family:var(--font-mono);color:var(--ink);font-weight:500}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:4px;padding:8px 10px}
.note.warn{background:var(--amber-soft);color:var(--ink)}
.note.ok{background:var(--good-soft);color:var(--ink)}
.note.err{background:var(--bad-soft);color:var(--ink)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:4px;padding:8px 12px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 8px;font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap}

.drop{border:1.5px dashed var(--line-2);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{font-size:13.5px;color:var(--ink-2)}

table.months{width:100%;border-collapse:collapse;font-size:13px}
table.months th{font:600 11px var(--font-head);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:2px 4px 4px}
table.months td{padding:2px 4px}
table.months td:first-child{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
table.months input{width:100%;border:1px solid var(--line);border-radius:3px;padding:4px 6px;background:var(--surface);font:13px var(--font-mono);min-width:0}
table.months input.auto{color:var(--ink-3)}
table.months input:disabled{background:var(--surface-2)}

.win{border:1px solid var(--line);border-radius:5px;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.win.off .wf{opacity:.45}
.win h4{font:600 15px var(--font-head);letter-spacing:.06em;text-transform:uppercase}

/* results */
.blk{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.blk h3{font-size:20px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
.blk .sub{font-size:13.5px;color:var(--ink-2);margin:-4px 0 12px;max-width:70ch}
.verdict p{font-size:17px;line-height:1.5;max-width:68ch}
.verdict p+p{margin-top:8px;font-size:14px;color:var(--ink-2)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.cx-axis{stroke:var(--line-2);stroke-width:1;fill:none}
.cx-grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.cx-t{fill:var(--ink-2);font:11px var(--font-mono)}
.cx-t.h{fill:var(--ink-3);font:600 10.5px var(--font-head);letter-spacing:.1em;text-transform:uppercase}
.cx-before{fill:var(--ink-3)} .cx-after{fill:var(--accent)}
.cx-lbefore{stroke:var(--ink-3);fill:none;stroke-width:1.6}
.cx-lafter{stroke:var(--accent);fill:none;stroke-width:2}
.cx-thr{stroke:var(--amber);stroke-dasharray:5 4;stroke-width:1.4;fill:none}
.cx-shave{fill:var(--amber);opacity:.28}
.cx-charge{fill:var(--accent);opacity:.18}
.cx-soc{stroke:var(--good);fill:none;stroke-width:2;stroke-dasharray:2 3}
.runbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.cx-zero{stroke:var(--ink);stroke-width:1.2}
.cx-pos{fill:var(--good);opacity:.14}
.cx-line{stroke:var(--good);fill:none;stroke-width:2.2}
.cx-dot{fill:var(--surface);stroke:var(--good);stroke-width:2.2}

/* bill with dot leaders */
.bill{font-family:var(--font-head);font-size:19px;max-width:620px}
.bill .r{display:flex;align-items:baseline;gap:8px;padding:3px 0}
.bill .r i{flex:1;border-bottom:2px dotted var(--line-2);min-width:12px;transform:translateY(-4px)}
.bill .r span{white-space:nowrap}
.bill .r .l{flex:0 1 auto;white-space:normal}
.bill .r .a,.bill .r .b{font-family:var(--font-mono);font-size:14px;min-width:78px;text-align:right}
.bill .r .d{font-family:var(--font-mono);font-size:14px;min-width:78px;text-align:right}
.bill .hd{font:600 11px var(--font-head);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.bill .hd .l{flex:1}
.bill .tot{border-top:2px solid var(--ink);margin-top:6px;padding-top:6px;font-weight:700}
.bill .sv{color:var(--good)} .bill .sv.neg{color:var(--bad)}
.scroll{overflow-x:auto;max-width:100%}

/* heat map */
.hm{border-collapse:separate;border-spacing:3px;font-family:var(--font-mono);font-size:12.5px}
.hm th{font:600 11px var(--font-head);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:2px 4px;text-align:center;white-space:nowrap}
.hm th.rh{text-align:right}
.hm td{padding:0}
.hm button{width:100%;min-width:62px;padding:8px 6px;border:1px solid transparent;border-radius:3px;background:var(--surface-2);color:var(--ink);cursor:pointer;font:inherit}
.hm button.pos{background:color-mix(in srgb,var(--good) calc(var(--t)*45%),var(--surface-2))}
.hm button.neg{background:color-mix(in srgb,var(--bad) calc(var(--t)*30%),var(--surface-2))}
.hm button.best{outline:2px solid var(--ink);outline-offset:1px}
.hm button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.hm button:hover{border-color:var(--ink-2)}
.hm-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hm-top select{padding:6px 8px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface)}
.hm-key{font-size:12.5px;color:var(--ink-3)}

table.cf{border-collapse:collapse;width:100%;font:12.5px var(--font-mono)}
table.cf th{font:600 11px var(--font-head);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:4px 8px;border-bottom:1px solid var(--line-2)}
table.cf td{text-align:right;padding:3px 8px;border-bottom:1px solid var(--line)}
table.cf th:first-child,table.cf td:first-child{text-align:left}
details.more{margin-top:10px}
details.more>summary{cursor:pointer;font-weight:600;color:var(--accent)}
.method li{margin-bottom:6px;color:var(--ink-2);max-width:78ch}
.method{margin:8px 0 0;padding-left:18px}
.range{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.range div{background:var(--surface-2);border-radius:4px;padding:8px 10px;min-width:0}
.range b{display:block;font:600 20px var(--font-head)}
.range span{font-size:12.5px;color:var(--ink-2)}

@media (max-width:979px){.readout{position:static}}
@media (max-width:820px){.start{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .ro-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ro{border-left:0;border-top:1px solid var(--line)}
  .ro:nth-child(-n+2){border-top:0}
  .ro:nth-child(even){border-left:1px solid var(--line)}
  .ro:last-child{grid-column:1/-1;border-left:0}
  .mast h1{font-size:26px}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dd>summary{flex-wrap:wrap}
  .dd>summary small{flex-basis:100%;order:3}
  .grid2.keep{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bill{font-size:17px}
  .bill .r .a,.bill .r .b,.bill .r .d{min-width:62px;font-size:12.5px}
  .bill .r .d{display:none}.bill .hd .d{display:none}
  .range{grid-template-columns:1fr}
}

.sub-h{font:600 15px var(--font-head);letter-spacing:.1em;text-transform:uppercase;margin:14px 0 0;color:var(--ink-2)}
#itemized[hidden],#price-box[hidden]{display:none}

</style>
<div class="wrap">
  <header class="mast">
    <h1>Peak Shave</h1>
    <p>How big a battery should be, and whether it pays back, when demand charges drive your bill.</p>
  </header>
  <section class="start" aria-label="Your inputs">
    <div class="card" id="start-bill"></div>
    <div class="card" id="start-cost"></div>
  </section>
  <h2 class="sh">Recommendation</h2>
  <section class="readout" id="readout" aria-live="polite" aria-label="Summary of the selected battery">
    <div class="busybar"></div>
    <div class="ro-grid"></div>
    <div class="runbar"><span id="runstat" role="status">Updating…</span><button class="btn sm" type="button" id="btn-run">Recalculate now</button></div>
  </section>
  <div id="verdict"></div>
  <details class="dd" id="dd-detail">
    <summary>Charts and bill breakdown <small>monthly peaks, peak day, annual bill, size grid, cash flow</small></summary>
    <div class="ddbody"><div class="out" id="out"></div></div>
  </details>
  <details class="dd" id="dd-config">
    <summary>Adjust other assumptions <small>monthly load, rates, time of use, efficiency, incentives</small></summary>
    <div class="ddbody"><div class="rail" id="rail"></div></div>
  </details>
</div>
<script>
/* Peak Shave engine: load generation, battery dispatch, billing, finance. Pure functions, no DOM. */
(function (root) {
'use strict';

const DT = 0.25;      // hours per 15-minute interval
const SPD = 96;       // intervals per day
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ---------- utilities ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function gauss(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function num(v, d) { v = +v; return isFinite(v) ? v : (d || 0); }

/* ---------- calendar ---------- */
function monthsEndingAt(endY, endM, n) {
  const out = [];
  for (let k = n - 1; k >= 0; k--) {
    let y = endY, m = endM - k;
    while (m < 0) { m += 12; y--; }
    out.push({ y, m, days: new Date(y, m + 1, 0).getDate(), dow0: new Date(y, m, 1).getDay(), label: MN[m] + ' ' + String(y).slice(2) });
  }
  return out;
}

/* ---------- synthetic load shapes (hourly, relative) ---------- */
const flat = (v) => new Array(24).fill(v);
const PROFILES = {
  office: { label: 'Office or professional services',
    wd: [.30,.30,.30,.30,.30,.32,.45,.70,.90,1,1,1,.95,1,1,1,.95,.80,.60,.45,.38,.34,.32,.30],
    we: [.30,.30,.30,.30,.30,.30,.30,.32,.34,.36,.36,.36,.36,.36,.36,.35,.34,.33,.32,.31,.30,.30,.30,.30] },
  retail: { label: 'Retail, seven days',
    wd: [.30,.28,.28,.28,.28,.30,.35,.50,.70,.90,1,1,1,1,1,1,1,1,1,.95,.85,.65,.45,.35],
    we: [.30,.28,.28,.28,.28,.30,.35,.50,.70,.90,1,1,1,1,1,1,1,1,1,.95,.85,.65,.45,.35] },
  restaurant: { label: 'Restaurant or bar',
    wd: [.25,.22,.20,.20,.20,.22,.30,.40,.50,.65,.80,.95,1,.95,.80,.70,.75,.90,1,1,.95,.85,.60,.40],
    we: [.25,.22,.20,.20,.20,.22,.30,.45,.65,.85,1,1,1,.95,.85,.75,.80,.95,1,1,.95,.85,.65,.40] },
  venue: { label: 'Evening venue or assembly hall',
    wd: [.20,.20,.20,.20,.20,.20,.20,.25,.30,.35,.40,.40,.40,.40,.45,.50,.60,.75,.95,1,1,.90,.60,.35],
    we: [.20,.20,.20,.20,.20,.20,.20,.25,.40,.60,.90,1,.90,.70,.60,.60,.60,.70,.85,.95,.90,.80,.50,.30] },
  warehouse: { label: 'Warehouse or light industrial, one shift',
    wd: [.35,.35,.35,.35,.35,.45,.80,1,1,1,1,.95,.90,1,1,1,.95,.70,.45,.38,.35,.35,.35,.35],
    we: flat(.33) },
  continuous: { label: 'Around the clock (healthcare, cold storage)',
    wd: [.80,.78,.78,.78,.78,.80,.85,.92,.97,1,1,1,1,1,1,1,.98,.96,.94,.90,.86,.84,.82,.80],
    we: [.76,.74,.74,.74,.74,.76,.80,.86,.92,.96,.97,.97,.97,.97,.97,.96,.94,.92,.90,.86,.82,.80,.78,.76] }
};

/* Build one month of 15-minute kW values that honours the monthly kWh and monthly peak kW. */
function genMonthLoad(mon, kwh, peak, profKey, sigma, seed) {
  const N = mon.days * SPD, P = PROFILES[profKey] || PROFILES.office, rnd = mulberry32(seed);
  const r = new Float64Array(N);
  let ar = 0;
  const eps = 0.5 * sigma;
  for (let d = 0; d < mon.days; d++) {
    const dow = (mon.dow0 + d) % 7, arr = (dow === 0 || dow === 6) ? P.we : P.wd;
    const df = Math.max(0.45, 1 + sigma * gauss(rnd));
    for (let s = 0; s < SPD; s++) {
      const h = s / 4, h0 = Math.floor(h), f = h - h0;
      const base = arr[h0] * (1 - f) + arr[(h0 + 1) % 24] * f;
      ar = 0.8 * ar + 0.6 * gauss(rnd);
      r[d * SPD + s] = Math.max(0.05, base * df * (1 + eps * ar));
    }
  }
  let mx = 0;
  for (let i = 0; i < N; i++) if (r[i] > mx) mx = r[i];
  for (let i = 0; i < N; i++) r[i] /= mx;
  const meanKw = kwh / (mon.days * 24);
  const R = Math.max(1.02, peak / Math.max(meanKw, 1e-6));
  const meanPow = (g) => { let s = 0; for (let i = 0; i < N; i++) s += Math.pow(r[i], g); return s / N; };
  let lo = 0.01, hi = 10;
  for (let it = 0; it < 36; it++) { const g = (lo + hi) / 2; if (meanPow(g) > 1 / R) lo = g; else hi = g; }

/* ---------- time windows ---------- */
function winMask(w, mon) {
  const N = mon.days * SPD, out = new Uint8Array(N);

  const m1 = mon.m + 1;
  const inM = w.mStart <= w.mEnd ? (m1 >= w.mStart && m1 <= w.mEnd) : (m1 >= w.mStart || m1 <= w.mEnd);
  if (!inM) return out;
  for (let d = 0; d < mon.days; d++) {
    const dow = (mon.dow0 + d) % 7, we = dow === 0 || dow === 6;
    if (w.days === 'weekdays' && we) continue;
    if (w.days === 'weekends' && !we) continue;
    for (let s = 0; s < SPD; s++) {
      const h = s / 4;
      const inH = w.start === w.end ? true : (w.start < w.end ? (h >= w.start && h < w.end) : (h >= w.start || h < w.end));
      if (inH) out[d * SPD + s] = 1;

}

/* ---------- rates ---------- */
function normRates(r) {
  const win = (w) => ({ on: !!w.on, rate: num(w.rate), start: num(w.start, 0), end: num(w.end, 24), days: w.days || 'weekdays', mStart: num(w.mStart, 1), mEnd: num(w.mEnd, 12) });

    fixed: num(r.fixed), demand: num(r.demand), rider: num(r.rider),
    pfOn: !!r.pfOn, pfThr: num(r.pfThr, 0.9), pfValue: num(r.pfValue, 0.9), pfCorrect: !!r.pfCorrect,
    energyBase: num(r.eEnergy) + num(r.eCommunity) + num(r.ePsa) + num(r.ePsaAdmin),
    mid: win(r.mid || {}), peak: win(r.peak || {}), pkDemand: win(r.pkDemand || {}),
    tax: num(r.tax) / 100, ratchet: num(r.ratchet) / 100

/* ---------- scenario: baseline facts per month ---------- */
function buildScenario(months, loads, rates) {
  return months.map((mon, i) => {
    const load = loads[i], N = load.length, days = mon.days;
    const maskPk = winMask(rates.pkDemand, mon);
    const price = new Float64Array(N).fill(rates.energyBase);
    if (rates.mid.on) { const mk = winMask(rates.mid, mon); for (let k = 0; k < N; k++) if (mk[k]) price[k] = rates.mid.rate; }
    if (rates.peak.on) { const mk = winMask(rates.peak, mon); for (let k = 0; k < N; k++) if (mk[k]) price[k] = rates.peak.rate; }
    let peakAll = 0, peakPk = 0, kwh = 0, energyCost = 0, anyPk = false;
    for (let k = 0; k < N; k++) {
      const L = load[k];

      if (maskPk[k]) { anyPk = true; if (L > peakPk) peakPk = L; }
      kwh += L * DT; energyCost += L * DT * price[k];
    }

      let mn = Infinity, mx = -Infinity;
      for (let s = 0; s < SPD; s++) { const p = price[d * SPD + s]; if (p < mn) mn = p; if (p > mx) mx = p; }
      dayMin[d] = mn; dayMax[d] = mx;

}

/* ---------- battery dispatch ---------- */
function feasible(sm, Tall, Tpk, P, E, ed, ec) {
  const load = sm.load, mask = sm.maskPk, N = sm.N;
  let S = E;
  for (let i = 0; i < N; i++) {
    const L = load[i], T = mask[i] ? Tpk : Tall;
    if (L > T) {
      const need = L - T;
      if (need > P + 1e-9) return false;
      if (need > S * ed / DT + 1e-9) return false;
      S -= need * DT / ed;
    } else {
      let c = T - L; if (c > P) c = P;
      const cap = (E - S) / (ec * DT); if (c > cap) c = cap;
      if (c > 0) S += c * ec * DT;

}

function minTall(sm, Tpk, P, E, ed, ec, lo, hi) {
  if (feasible(sm, lo, Tpk, P, E, ed, ec)) return lo;
  for (let k = 0; k < 16; k++) {
    const mid = (lo + hi) / 2;
    if (feasible(sm, mid, Tpk, P, E, ed, ec)) hi = mid; else lo = mid;

function findThresholds(sm, P, E, ed, ec, wA, wP) {
  if (!sm.hasPk) {
    const Ta = minTall(sm, Infinity, P, E, ed, ec, Math.max(0, sm.peakAll - P), sm.peakAll);
    return { Tall: Ta, Tpk: Infinity };
  }
  const pkLo = Math.max(0, sm.peakPk - P), pkHi = sm.peakPk;
  let best = null, bestC = Infinity;
  for (let k = 0; k <= 10; k++) {

    if (!feasible(sm, sm.peakAll, Tp, P, E, ed, ec)) continue;
    const Ta = minTall(sm, Tp, P, E, ed, ec, Math.max(Tp, sm.peakAll - P), sm.peakAll);
    const c = wA * Ta + wP * Tp;
    if (c < bestC) { bestC = c; best = { Tall: Ta, Tpk: Tp }; }

function dispatch(sm, Tall, Tpk, P, E, eta, ed, ec, arb, rec) {
  const load = sm.load, mask = sm.maskPk, price = sm.price, N = sm.N;
  let S = E, pa = 0, pp = 0, cost = 0, kwhGrid = 0;

    for (let d = 0; d < days; d++) {
      for (let s = SPD - 1; s >= 0; s--) {
        const i = d * SPD + s, T = mask[i] ? Tpk : Tall;

function simulateMonth(sm, P, Eus, eta, rates, fA, rec) {

    const d1 = dispatch(sm, th.Tall, th.Tpk, P, Eus, eta, ed, ec, true, rec);
    const c1 = cost(d1);
    if (c1 < bc) { best = d1; bc = c1; }

/* ---------- billing ---------- */
function ratchetApply(peaks, pct) {
  const n = peaks.length;
  if (!(pct > 0)) return peaks.slice();
  return peaks.map((p, m) => {
    let mx = 0;
    for (let k = 1; k <= Math.min(11, n - 1); k++) mx = Math.max(mx, peaks[((m - k) % n + n) % n]);
    return Math.max(p, pct * mx);

function bill(peaks, pks, energy, f, rates, n) {

function evalYear(scn, rates, batt, capFactor, rec) {
  const n = scn.length;
  const P = batt.P, Eus = batt.E * batt.usable * capFactor, eta = batt.eta;
  const fB = (rates.pfOn && rates.pfValue > 0 && rates.pfValue < rates.pfThr) ? rates.pfThr / rates.pfValue : 1;

    before, after, save: before.total - after.total, saveD, saveE, fB, fA,
    monthly: scn.map((sm, m) => ({ label: sm.mon.label, before: bp[m], after: ap[m] })),

/* ---------- finance ---------- */
const MACRS5 = [0.20, 0.32, 0.192, 0.1152, 0.1152, 0.0576];

function capexOf(batt, fin) {
  if (fin.itemized) return fin.fixed + fin.perKw * batt.P + fin.perKwh * batt.E;

function lifetimeAnchors(scn, rates, batt, fin) {
  const L = fin.life;
  const ys = Array.from(new Set([1, Math.max(1, Math.round((L + 1) / 2)), L]));
  return ys.map((y) => { const r = evalYear(scn, rates, batt, Math.pow(1 - fin.deg, y - 1), false); return { yr: y, s: r.save, sD: r.saveD, sE: r.saveE }; });
}

function interp(anchors, y, key) {
  key = key || 's';

  for (let i = 1; i < anchors.length; i++) {
    if (y <= anchors[i].yr) {

function cashflow(anchors, capex, fin) {

function irrOf(cf) {

/* ---------- optimizer ---------- */
const DURATIONS = [0.5, 1, 1.5, 2, 3, 4];

/* ---------- state to inputs ---------- */
function refreshAuto() { if (state.interval) return; state.months.forEach((m) => { if (!m.manual) m.peak = autoPeak(m); }); }
function monthRows() {
  const body = $('#mrows');
  const sig = (state.interval ? 'iv:' : 'est:') + currentMonths().map((m) => m.label).join('|');
  if (body.dataset.sig !== sig) {
    body.dataset.sig = sig;
    body.innerHTML = currentMonths().map((m, i) => '<tr><td>' + esc(m.label) + '</td><td><input type="number" inputmode="decimal" step="any" data-k="months.' + i + '.kwh" aria-label="' + esc(m.label) + ' kWh"></td><td><input type="number" inputmode="decimal" step="any" data-k="months.' + i + '.peak" aria-label="' + esc(m.label) + ' peak kW"></td></tr>').join('');
  }
}
function currentMonths() { return state.interval ? state.interval.display : state.months; }
function syncInputs() {
  refreshAuto();
  monthRows();
  $$('[data-k]').forEach((el) => {
    const k = el.dataset.k;
    let v = k.startsWith('months.') && state.interval ? getp({ months: state.interval.display }, k) : getp(state, k);
    if (el.type === 'checkbox') el.checked = !!v;
    else if (document.activeElement !== el) el.value = (v === undefined || v === null) ? '' : (typeof v === 'number' ? +v.toFixed(6) : v);
    if (k.startsWith('months.')) {
      el.disabled = !!state.interval;
      if (k.endsWith('.peak')) el.classList.toggle('auto', !state.interval && !state.months[+k.split('.')[1]].manual);
    }
  });
  $$('.win').forEach((w) => w.classList.toggle('off', !getp(state, w.dataset.win + '.on')));
  const r = E.normRates(state.rates);
  $('#s-kw').textContent = usd(r.demand + r.rider, 2) + ' per kW';
  $('#s-kwh').textContent = '$' + r.energyBase.toFixed(5) + ' per kWh';
  $('#pnote').textContent = PRESETS[state.preset].note || '';
  $('#pnote').hidden = !PRESETS[state.preset].note;
  $('#manual-box').hidden = state.batt.mode !== 'manual';
  $('#itemized').hidden = !state.batt.itemize;
  $('#price-box').hidden = !!state.batt.itemize;
  updCostEg();
  const iv = $('#ivmsg');
  if (state.interval) {
    iv.innerHTML = '<div class="note ok">Using your interval data: ' + state.interval.display.length + ' months of ' + state.interval.step + '-minute readings (' + esc(state.interval.fileName) + '). The table shows what the file contains. ' +
      (state.interval.warn.length ? esc(state.interval.warn.join('; ')) + '. ' : '') + (state.interval.display.length < 12 ? 'Fewer than 12 months, so annual figures are scaled up. ' : '') +
      '<button class="btn sm" type="button" id="btn-clear-iv">Go back to estimates</button></div>';
  } else iv.innerHTML = '';
  $('#mnote').hidden = !!state.interval;
  if (!state.interval) {
    const tot = state.months.reduce((s, m) => s + m.kwh, 0);
    $('#mnote').innerHTML = '<span>12-month total</span><b>' + f0(tot) + ' kWh</b>';
  }
  $$('#btn-reest').forEach((b) => (b.disabled = !!state.interval));
}

function updCostEg() {
  const el = $('#cost-eg'); if (!el) return;
  el.textContent = usd(E.capexOf({ P: 10, E: 20 }, finObj()));

/* ---------- loading data into the model ---------- */
const loadCache = new Map();
function getLoads(sigmaPct) {
  if (state.interval) return { months: state.interval.months, loads: state.interval.loads };
  const key = JSON.stringify([state.months.map((m) => [m.kwh, m.manual ? m.peak : autoPeak(m)]), state.profile, sigmaPct]);
  if (loadCache.has(key)) return loadCache.get(key);
  const months = state.months, sg = sigmaPct / 100;
  const loads = months.map((m, i) => E.genMonthLoad(m, Math.max(0, m.kwh), Math.max(0, m.manual ? m.peak : autoPeak(m)), state.profile, sg, 7000 + i * 13));
  const out = { months, loads };
  if (loadCache.size > 6) loadCache.clear();
  loadCache.set(key, out);
  return out;
}
function finObj() {
  const b = state.batt, f = state.fin;
  return { price: b.price, itemized: !!b.itemize, fixed: b.fixed, perKw: b.perKw, perKwh: b.perKwh, om: b.om / 100, life: Math.max(1, Math.round(b.life)), deg: b.deg / 100,
    disc: f.disc / 100, esc: f.esc / 100, escD: f.escD / 100, itc: f.itc / 100, rebate: f.rebate, tax: f.tax / 100, macrs: !!f.macrs };
}
const battOf = (p, e) => ({ P: p, E: e, usable: Math.min(1, Math.max(0.1, state.batt.usable / 100)), eta: Math.min(1, Math.max(0.5, state.batt.eta / 100)) });

function peakWidth(scn) {
  let mi = 0; scn.forEach((sm, i) => { if (sm.peakAll > scn[mi].peakAll) mi = i; });
  const sm = scn[mi], delta = 0.1 * sm.peakAll, T = sm.peakAll - delta;
  let worst = 0;
  for (let d = 0; d < sm.mon.days; d++) { let e = 0; for (let k = 0; k < 96; k++) { const L = sm.load[d * 96 + k]; if (L > T) e += (L - T) * 0.25; } if (e > worst) worst = e; }
  return { delta, kwh: worst, perKw: delta > 0 ? worst / delta : 0, label: sm.mon.label };
}

/* ---------- the run ---------- */
let runId = 0, timer = null, last = null;
function setStat(t) { const e = $('#runstat'); if (e) e.textContent = t; }
function schedule() { clearTimeout(timer); timer = setTimeout(run, 280); const ro = $('#readout'); if (ro) ro.classList.add('busy'); setStat('Updating\u2026'); }

async function run() {
  const id = ++runId;
  const ro = $('#readout'); ro.classList.add('busy'); setStat('Updating\u2026');
  await tick();
  const rates = E.normRates(state.rates), fin = finObj();
  const ld = getLoads(state.sigma);
  const scn = E.buildScenario(ld.months, ld.loads, rates);
  const Ps = E.powerCandidates(scn, state.batt.maxKw);
  const grid = [];
  for (const p of Ps) {
    const row = [];
    for (const d of E.DURATIONS) row.push(E.evalCandidate(scn, rates, battOf(p, p * d), fin));
    grid.push(row);
    await tick();
    if (id !== runId) return;
  }
  const flat = [].concat.apply([], grid);
  const best = E.pickBest(flat, state.batt.objective);
  let sel = best;
  if (state.batt.mode === 'manual' && state.batt.manualKw > 0 && state.batt.manualKwh > 0) sel = E.evalCandidate(scn, rates, battOf(state.batt.manualKw, state.batt.manualKwh), fin);
  const sb = battOf(sel.P, sel.E);
  const y1 = E.evalYear(scn, rates, sb, 1, true);
  await tick(); if (id !== runId) return;
  let range = null;
  if (!state.interval) {
    range = [];
    for (const s of [Math.max(3, state.sigma * 0.45), state.sigma, state.sigma * 2]) {
      const l2 = getLoads(s), sc2 = E.buildScenario(l2.months, l2.loads, rates);
      range.push(E.evalYear(sc2, rates, sb, 1, false).save);
      await tick(); if (id !== runId) return;
    }
  }
  last = { rates, fin, scn, grid, Ps, best, sel, y1, range, sb };
  render();
  ro.classList.remove('busy');
  setStat('Up to date. Results update automatically when you change an input.');
}

/* ---------- rendering ---------- */

  const L = fin.life;

  const payOk = sel.payback !== null;
  $('.ro-grid', ro).innerHTML =

    '<div class="ro ' + (sel.npv > 0 ? 'good' : 'bad') + '"><div class="k">Net present value' + tipBtn('ro.npv') + '</div><div class="v">' + usd(sel.npv) + '</div><div class="s">' + L + ' years at ' + state.fin.disc + '%</div></div>';

    v = '<p>A ' + sizeTxt + ' battery costs about ' + usd(sel.capex) + ' (' + usd(sel.net0) + ' after incentives). It trims your annual bills by ' + usd(save1) + ' in year one, pays itself back in ' + yrs(sel.payback) + ' years, and is worth ' + usd(sel.npv) + ' over ' + L + ' years at a ' + state.fin.disc + '% discount rate.</p>';
  } else {

      (sel.bePrice > 0 ? 'It would break even at about ' + usd(sel.bePrice) + ' per kWh installed at that size, against ' + usd(sel.capex / sel.E) + ' now.' : 'Savings are too small to cover upkeep at any price.') + '</p>';
  }
  v += '<p>In ' + esc(peakMonth.label) + ', your peak month, billed demand falls from ' + f1(peakMonth.before) + ' kW to ' + f1(peakMonth.after) + ' kW.' +
    (rates.pfOn && y1.before.pf > 1 ? ' Your modeled bill includes ' + usd(y1.before.pf * (1 + rates.tax)) + ' a year in power factor charges' + (rates.pfCorrect ? ', which the inverter removes.' : '. Turning on power factor correction under Adjust other assumptions, Rates shows what fixing that is worth; a capacitor bank usually costs far less than a battery.') : '') + '</p>';
  const pw = peakWidth(scn), vkw = (rates.demand + rates.rider) * y1.fB * (1 + rates.tax) * 12;
  const shaved = y1.monthly.reduce((a, m) => a + (m.before - m.after), 0) / 12;
  v += '<p>Why the size stays small: each kW taken off every month\'s peak is worth about ' + usd(vkw) + ' a year here. ' +
    (pw.kwh > 0 ? (pw.perKw >= 3
      ? 'Your peaks are wide: trimming ' + esc(pw.label) + '\'s peak by ' + f1(pw.delta) + ' kW takes about ' + f0(pw.kwh) + ' kWh of storage on the worst day, roughly ' + f1(pw.perKw) + ' kWh per kW, so energy capacity is the expensive part. '
      : 'Your peaks are short: trimming ' + esc(pw.label) + '\'s peak by ' + f1(pw.delta) + ' kW takes only about ' + f0(pw.kwh) + ' kWh of storage on the worst day, so power capacity (kW) is the expensive part, not storage. ') : '') +

  let conf;
  if (state.interval) conf = 'Based on your interval readings, so the monthly peaks and the shape of each day are real.';
  else {

  }
  const tx = 1 + rates.tax;
  const sDem = (y1.before.demand + y1.before.peakDemand - y1.after.demand - y1.after.peakDemand) * tx, sPf = (y1.before.pf - y1.after.pf) * tx, sEn = (y1.before.energy - y1.after.energy) * tx;

function niceMax(v) {

  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  return { max: Math.ceil(v / step) * step, step };
}

function say(html, cls) { $('#upmsg').innerHTML = html ? '<div class="note ' + (cls || '') + '">' + html + '</div>' : ''; }
let pdfLoading = null;
function loadPdfJs() {

  if (!pdfLoading) pdfLoading = new Promise((res, rej) => {

    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFWORKER; res(window.pdfjsLib); };
    s.onerror = () => { pdfLoading = null; rej(new Error('The PDF reader did not load. Check your connection and try again.')); };
    document.head.appendChild(s);

}
async function readBillPdf(file) {

    const page = await pdf.getPage(p), tc = await page.getTextContent();

      try {
        const vp = page.getViewport({ scale: 200 / 72 }), cv = document.createElement('canvas');

        const ctx = cv.getContext('2d', { willReadFrequently: true });

        for (let i = 0; i < gray.length; i++) gray[i] = 0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2];
        const am = /13 month avg\. consumption:\s*([\d.,]+)/i.exec(pt);
        chart = P.extractMonthlyKwh({ gray, W: cv.width, H: cv.height, items: P.toPixelItems(tc, vp, lib.Util), scale: vp.scale, avg: am ? parseFloat(am[1].replace(/,/g, '')) : null });

}

    if (k === 'preset') { applyPreset(v); syncInputs(); schedule(); return; }

  });

}


/* ---------- tooltips ---------- */
function initTips() {
  const box = document.createElement('div');
  box.id = 'tipbox'; box.setAttribute('role', 'tooltip'); box.hidden = true;
  document.body.appendChild(box);
  let cur = null;
  const hide = () => { box.hidden = true; cur = null; };
  const show = (btn) => {
    cur = btn; box.textContent = btn.dataset.tip; box.hidden = false;
    const r = btn.getBoundingClientRect(), bw = box.offsetWidth, bh = box.offsetHeight;
    let x = r.left + r.width / 2 - bw / 2; x = Math.max(8, Math.min(x, window.innerWidth - bw - 8));
    let y = r.bottom + 8; if (y + bh > window.innerHeight - 8) y = Math.max(8, r.top - bh - 8);
    box.style.left = x + 'px'; box.style.top = y + 'px';
  };
  const tipOf = (e) => (e.target && e.target.closest) ? e.target.closest('.tip') : null;
  document.body.addEventListener('mouseover', (e) => { const t = tipOf(e); if (t) show(t); });
  document.body.addEventListener('mouseout', (e) => { if (tipOf(e)) hide(); });
  document.body.addEventListener('focusin', (e) => { const t = tipOf(e); if (t) show(t); });
  document.body.addEventListener('focusout', (e) => { if (tipOf(e)) hide(); });
  document.body.addEventListener('click', (e) => {
    const t = tipOf(e);
    if (t) { e.preventDefault(); e.stopPropagation(); if (cur === t && !box.hidden) hide(); else show(t); } else if (!box.hidden) hide();
  }, true);
  document.body.addEventListener('keydown', (e) => { if (e.key === 'Escape') hide(); });
  window.addEventListener('scroll', hide, true);
}
